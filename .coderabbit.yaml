# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit config — review of QuitCode Workshop 6 submission PRs.
# Workshop: "Специфікації на практиці: старт командного проєкту".
# The work itself lives in one shared repository per team (in the PM's personal account) and is
# graded by the instructor's pipeline at the team-main SHA from the submission file. Here CodeRabbit checks ONLY
# the submission PR: one new file submissions/<team-slug>/<github-login>.md, its fields, and that
# nothing else changed. Every check is STATIC over the diff and the PR description: no network,
# no npm, no cloning of linked repositories.
# Limits: custom check names < 50 chars, tone_instructions ≤ 250 chars — otherwise CodeRabbit
# silently ignores the WHOLE file (tells: review in English, docstring check reappears).

language: "uk-UA"
tone_instructions: >
  Ментор курсу QuitCode. Українською, коротко й доброзичливо. Перевіряєш лише файл здачі
  WS6 і опис PR. Статуси: ✅ зроблено, ⚠️ частково, ❌ бракує.

early_access: false

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: false
  in_progress_fortune: false

  auto_review:
    enabled: true
    drafts: true
    base_branches:
      - ".*"
    ignore_title_keywords:
      - "WIP"
      - "[skip review]"
    ignore_usernames:
      - "dependabot[bot]"
      - "renovate[bot]"
      - "github-actions[bot]"

  # Every path of the repository is listed, so that changes outside submissions/ are visible
  # to the "nothing else changed" check.
  path_filters:
    - "submissions/**"
    - "README.md"
    - "AGENTS.md"
    - "CLAUDE.md"
    - "docs/**"
    - "materials/**"
    - "examples/**"
    - ".github/**"
    - ".coderabbit.yaml"
    - ".gitignore"
    - ".gitattributes"
    - "**"

  path_instructions:
    - path: "submissions/*/*.md"
      instructions: |
        Файл здачі WS6. Статичне рев'ю, посилань не відкривай і нічого не запускай.
        Шлях: submissions/<team-slug>/<github-login>.md; team-slug — рівно один із
        property-workflows, therapy-scheduling, school-purchasing, leave-portal; ім'я файла
        (без .md) збігається з полем «GitHub-логін» і, якщо видно, з логіном автора PR (без
        урахування регістру). Розділ «Дані»: «Роль» — pm, techlead або dev; «Команда» — та сама, що
        тека; «Репо команди» — https://github.com/<owner>/<repo> без зайвого шляху; «SHA» — рівно 40
        символів [0-9a-f] (коротший SHA, гілка чи тег — ❌); «Версія спеки» — spec-vX.Y або
        spec-vX.Y.Z; «Прод-URL» — https://….vercel.app (або інший https-домен із поясненням).
        Усі посилання на роботу ведуть у той самий owner/repo, що «Репо команди» (PR — …/pull/N,
        issues — …/issues/N, коментарі — …/issues/N#issuecomment-M, рев'ю — …/pull/N#pullrequestreview-M,
        файли — …/blob/…, теги — …/releases/tag/spec-vX.Y або …/tree/spec-vX.Y). Роль pm заповнює розділ «PM», а розділ «Розробник» — рівно «—»; ролі
        techlead і dev — навпаки. pm: «Нотатка PM» має щонайменше 3 пункти, у кожному — AC ID,
        щонайменше два прочитання з посиланнями (пункт із поміткою «прогноз» — два прочитання без
        посилань), «Чому» і «Що зробив PM»; без посилання можуть бути лише «spec-v0.2 не випущено» в
        полях «PR зміни spec-v0.2» і «Тег spec-v0.2». techlead/dev: перший PR (docs/team.md) —
        …/pull/N; щонайменше 3 посилання на issues або коментарі в issues, щонайменше одне — без
        #issuecomment; щонайменше 2 посилання …/pull/N у «PR-и задач»; щонайменше 2 посилання
        …/pull/N#pullrequestreview-M у «Рев'ю PR-ів колег», і вони не на PR зі списку «PR-и задач»
        (власний PR схвалити не можна); «AC, до яких ви доклалися» — список AC ID; «PR зміни impl-<зріз>» —
        для techlead посилання …/pull/N, для dev «—» або посилання.
        Бонус E — «—» або опис із посиланням. Плейсхолдери <…>, «…» чи незаповнені коментарі-підказки
        замість значень — ⚠️. Повне ім'я людини у файлі — ⚠️ (ім'я лише в описі PR; логіни — нормально).
        Значення секретів (sb_secret_, sb_publishable_ зі значенням, sbp_, eyJ…, паролі, рядки
        підключення з паролем, postgresql://…), email не з домену example.test — ❌.

    - path: "submissions/_template.md"
      instructions: |
        Шаблон здачі — матеріал курсу, учасник його не змінює. Будь-яка зміна — ❌:
        скопіюйте шаблон у submissions/<team-slug>/<github-login>.md.

    - path: "submissions/README.md"
      instructions: |
        Інструкція здачі — матеріал курсу. Будь-яка зміна — ❌.

    - path: "submissions/*/.gitkeep"
      instructions: |
        Службові файли тек команд. Видалення чи зміна — ❌.

    - path: "docs/**"
      instructions: |
        Інструкції курсу (walkthrough-pm, walkthrough-dev, spec-guide). У PR здачі не змінюються —
        будь-яка зміна ❌. Помилку в матеріалах повідомляють окремим issue, а не в PR здачі.

    - path: "materials/**"
      instructions: |
        Брифи команд і JSON ruleset-ів — матеріали курсу. Будь-яка зміна в PR здачі — ❌.

    - path: "examples/**"
      instructions: |
        Зразки з демо-репозиторію — матеріал курсу. Будь-яка зміна в PR здачі — ❌.

    - path: ".github/**"
      instructions: |
        Шаблон PR курсу. Будь-яка зміна в PR здачі — ❌.

    - path: "README.md"
      instructions: |
        README курсу. Будь-яка зміна в PR здачі — ❌.

    - path: "AGENTS.md"
      instructions: |
        Правила агента для репозиторію курсу. Будь-яка зміна в PR здачі — ❌.

    - path: "CLAUDE.md"
      instructions: |
        Імпорт AGENTS.md для Claude Code. Будь-яка зміна в PR здачі — ❌.

  pre_merge_checks:
    docstrings:
      mode: "off"

    title:
      mode: "warning"
      requirements: >
        PR title should follow: "WS6: <participant full name>" (two words, a real name, not a GitHub login).

    # The built-in description check takes only `mode`; the name requirement is a custom check.
    description:
      mode: "warning"

    custom_checks:
      - mode: "warning"
        name: "Опис PR: ім'я та прізвище"
        instructions: >
          Static review of the PR description only; do NOT review the diff or execute anything.
          The description MUST contain a filled-in "Ім'я та Прізвище" field under the "Учасник"
          heading with the participant's real full name (two words). An empty field, a leftover
          placeholder or template comment, or only a GitHub login is NOT acceptable: say so and ask
          the author to add it. Also check that "Роль" (PM, техлід or розробник) and "Команда" are filled and that the
          Definition of Done checklist for the participant's role is filled in rather than left as
          unchecked template boxes. PASS if all hold; FAIL otherwise. Answer in Ukrainian.

      - mode: "warning"
        name: "Лише один файл здачі"
        instructions: >
          Static review of the diff only. PASS only if the PR adds exactly one file and changes
          nothing else, and that file is submissions/<team-slug>/<github-login>.md where team-slug
          is one of property-workflows, therapy-scheduling, school-purchasing, leave-portal, and
          github-login matches the "GitHub-логін" field inside the file (case-insensitive) and, when
          visible, the PR author's login. FAIL if any other file is added, modified or deleted
          (README.md, AGENTS.md, CLAUDE.md, docs/, materials/, examples/, .github/, .coderabbit.yaml,
          .gitignore, .gitattributes, submissions/README.md, submissions/_template.md, .gitkeep files,
          another participant's submission), or if the file is placed elsewhere or named differently.
          Name every offending path. Answer in Ukrainian.

      - mode: "warning"
        name: "Поля файлу здачі заповнено"
        instructions: >
          Static review of the submission file only; do NOT open links or run anything. Check the
          "Дані" section: Роль is pm, techlead or dev; Команда equals the folder name; Репо команди is
          https://github.com/<owner>/<repo>; SHA is exactly 40 lowercase hex characters (a short SHA,
          branch or tag name is a FAIL); Версія спеки matches spec-vX.Y or spec-vX.Y.Z; Прод-URL is an
          https URL (normally *.vercel.app). Every work link points to the same owner/repo as Репо
          команди and uses full https://github.com/ links (pull requests as /pull/N, issues as
          /issues/N, issue comments as /issues/N#issuecomment-M, reviews as
          /pull/N#pullrequestreview-M, files as /blob/..., tags as /releases/tag/spec-vX.Y or
          /tree/spec-vX.Y). Role pm fills the "PM" section and the
          "Розробник" section is exactly "—"; roles techlead and dev do the opposite. For pm, "Нотатка
          PM" has at least three items, each with an AC ID, at least two readings with links (an item
          marked «прогноз» may give two readings without links), "Чому" and "Що зробив PM"; the only
          non-link values allowed are "spec-v0.2 не випущено" for "PR зміни spec-v0.2" and "Тег
          spec-v0.2". For techlead and dev: the first PR (docs/team.md) is a /pull/N link; at least
          three links to issues or issue comments, at least one of them a plain issue link without
          #issuecomment; at least two /pull/N links under "PR-и задач"; at least two
          /pull/N#pullrequestreview-M links under "Рев'ю PR-ів колег", none of them on a pull request
          listed under "PR-и задач" (authors cannot approve their own PR); "AC, до яких ви доклалися" lists AC
          IDs; "PR зміни impl-<зріз>" is a /pull/N link for techlead and "—" or a link for dev.
          Бонус E is "—" or a description with a link. Placeholders such as <…>, "…" or untouched
          template comments instead of values are a FAIL. List every missing or malformed field.
          Answer in Ukrainian.

      - mode: "warning"
        name: "Анонімізація й секрети у здачі"
        instructions: >
          Static review of the diff only. FAIL if the submission file contains a secret value
          (sb_secret_ or sb_publishable_ followed by a value, sbp_ tokens, JWT-looking eyJ strings,
          passwords, database URLs with a password), an email address outside the example.test
          domain, a person's full name (names belong only in the PR description; GitHub logins are
          fine), or what looks like a real client or company name rather than the four team slugs and
          generic product words. Vendor names such as Supabase, Vercel, GitHub, QuickBooks or Buildium
          are fine. PASS otherwise. Answer in Ukrainian.

chat:
  auto_reply: true
