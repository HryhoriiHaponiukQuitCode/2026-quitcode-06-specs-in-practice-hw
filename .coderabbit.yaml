# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit config — review of QuitCode Workshop 6 submission PRs.
# Workshop: "Специфікації на практиці: старт командного проєкту".
# The work itself lives in each participant's own repository: the PM's requirements repo
# <pm>/<team-slug>-spec (from the spec template; requirements in plain language as issues
# «Продукт»/«Вимога» or as docs/ files, questions as issues «Питання до вимог») and every
# developer's own implementation repo <dev>/<team-slug> (from the project template; requirements
# arrive in requirements/ only via /requirements-sync, the developer translates them into OpenSpec).
# The instructor's pipeline grades that repo at the main SHA from the submission file, and
# questions and answers by issues in the PM's repo. Here CodeRabbit checks ONLY the submission PR:
# one new file submissions/<team-slug>/<github-login>.md, its fields, and that nothing else
# changed. Every check is STATIC over the diff and the PR description: no network, no npm, no
# cloning of linked repositories.
# Limits: custom check names < 50 chars, tone_instructions ≤ 250 chars — otherwise CodeRabbit
# silently ignores the WHOLE file (tells: review in English, docstring check reappears).

language: "uk-UA"
tone_instructions: >
  Ментор курсу QuitCode. Українською, коротко й доброзичливо. Перевіряєш лише файл здачі
  WS6 і опис PR. Статуси: ✅ зроблено, ⚠️ частково, ❌ бракує.

early_access: false

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: false
  in_progress_fortune: false

  auto_review:
    enabled: true
    drafts: true
    base_branches:
      - ".*"
    ignore_title_keywords:
      - "WIP"
      - "[skip review]"
    ignore_usernames:
      - "dependabot[bot]"
      - "renovate[bot]"
      - "github-actions[bot]"

  # Every path of the repository is listed, so that changes outside submissions/ are visible
  # to the "nothing else changed" check.
  path_filters:
    - "submissions/**"
    - "README.md"
    - "AGENTS.md"
    - "CLAUDE.md"
    - "docs/**"
    - "materials/**"
    - "examples/**"
    - ".github/**"
    - ".coderabbit.yaml"
    - ".gitignore"
    - ".gitattributes"
    - "**"

  path_instructions:
    - path: "submissions/*/*.md"
      instructions: |
        Файл здачі WS6. Статичне рев'ю, посилань не відкривай і нічого не запускай.
        Шлях: submissions/<team-slug>/<github-login>.md; team-slug — рівно один із
        property-workflows, therapy-scheduling, school-purchasing, leave-portal; ім'я файла
        (без .md) збігається з полем «GitHub-логін» і, якщо видно, з логіном автора PR (без
        урахування регістру). Розділ «Дані»: «Роль» — pm або dev; «Команда» — та сама, що тека;
        «Ваше репо» — https://github.com/<owner>/<repo> без зайвого шляху, owner — це «GitHub-логін»
        (інакше ⚠️); назва репо для pm зазвичай <team-slug>-spec, для dev — <team-slug> (інша назва —
        ⚠️, не ❌); «SHA» — рівно 40 символів [0-9a-f] (коротший SHA, гілка чи тег — ❌);
        «Репо вимог PM» — https://github.com/<owner>/<repo> (зазвичай …/<team-slug>-spec), для pm — те
        саме, що «Ваше репо»; «Прод-URL» — для dev https://….vercel.app (або інший https-домен із
        поясненням), для pm — «—». Роль pm заповнює розділ «PM», а розділ «Розробник» — рівно «—»;
        роль dev — навпаки.
        pm: усі посилання розділу «PM», крім «Нотатки PM», — у «Ваше репо». «Сховище вимог» — issues, docs
        або docs/. issues: «Продукт» — одне …/issues/N; «Вимоги першого зрізу» — …/issues/N;
        «Самоперевірка за чеклістом» — …/issues/N#issuecomment-M; «Зміни вимог із журналом змін» —
        …/issues/N#issuecomment-M. docs: «Продукт» — …/blob/<SHA>/docs/product.md; «Вимоги першого
        зрізу» — …/blob/<SHA>/docs/requirements/<NN>-<slug>.md; «Самоперевірка за чеклістом» —
        …/blob/<SHA>/docs/requirements/…#L<N> (рядок журналу змін) або …/commit/<sha>#commitcomment-M;
        «Зміни вимог із журналом змін» — …/commit/<sha> або
        …/blob/<SHA>/docs/requirements/…#L<N>. Будь-яка з цих форм прийнятна для обох варіантів (не ❌);
        «Зміни вимог із журналом змін» може бути рівно «змін не було». «Питання, на які ви відповіли» —
        …/issues/N. «Нотатка PM» має щонайменше 3 пункти, у кожному — AC ID, щонайменше дві реалізації чи
        прочитання з посиланнями (посилання можуть вести в репо розробників іншого owner —
        https://github.com/<dev>/<repo>/blob/…, …/pull/N — або на issues і коментарі в «Ваше репо»; пункт
        із поміткою «прогноз» — два прочитання без посилань), «Чому» і «Що зробив PM».
        dev: поле «Рядок «Вимоги:» з docs/conformance.md на SHA» — дослівно
        «Вимоги: <URL> · джерело: issues · знімок <YYYY-MM-DD>» (або «джерело: docs»), де URL —
        https://github.com/<owner>/<repo> і збігається з «Репо вимог PM»; заглушка «Вимоги: — (заповнює
        /requirements-sync)», локальний шлях замість URL чи інше джерело — ❌; дата знімка раніша за
        2026-10-19 — ⚠️ (для D потрібен знімок від 19.10), якщо в полі «PR «Оновлення вимог» після
        уточнень PM» немає рядка «/requirements-sync <YYYY-MM-DD>: Вимоги актуальні» з датою від
        2026-10-19 (тоді рання дата знімка — нормально). «Перший PR «Оновлення вимог»», «PR
        «Специфікація» з перекладом першого зрізу», «PR-и задач «Реалізація»» і «PR «Оновлення вимог»
        після уточнень PM» — …/pull/N у «Ваше репо» (в останньому полі може бути ще й рядок
        «/requirements-sync <YYYY-MM-DD>: Вимоги актуальні» — це не ❌); «PR «Специфікація» зі змінами
        після уточнень» — …/pull/N у «Ваше репо» або рівно «змін у вимогах PM не було»; журнал docs/spec-reading.md і «Зміна
        impl-<зріз>» — …/blob/… або …/tree/… у «Ваше репо». «Питання в репо PM» — щонайменше 3 посилання
        на «Репо вимог PM» (…/issues/N або …/issues/N#issuecomment-M), щонайменше одне — …/issues/N без
        #issuecomment. У «PR-и задач «Реалізація»» щонайменше 2 посилання …/pull/N (або 1, якщо у файлі
        пояснено, що PM опублікував перші вимоги пізніше за кінець 16.10 — README, «Не знімає балів»);
        «AC, які ви реалізували» — список AC ID. Бонус E — «—» або опис із посиланням.
        Плейсхолдери <…>, «…» чи незаповнені коментарі-підказки замість значень — ⚠️. Повне ім'я людини
        у файлі — ⚠️ (ім'я лише в описі PR; логіни — нормально).
        Значення секретів (sb_secret_, sb_publishable_ зі значенням, sbp_, eyJ…, паролі, рядки
        підключення з паролем, postgresql://…), email не з домену example.test — ❌.

    - path: "submissions/_template.md"
      instructions: |
        Шаблон здачі — матеріал курсу, учасник його не змінює. Будь-яка зміна — ❌:
        скопіюйте шаблон у submissions/<team-slug>/<github-login>.md.

    - path: "submissions/README.md"
      instructions: |
        Інструкція здачі — матеріал курсу. Будь-яка зміна — ❌.

    - path: "submissions/*/.gitkeep"
      instructions: |
        Службові файли тек команд. Видалення чи зміна — ❌.

    - path: "docs/**"
      instructions: |
        Інструкції курсу (walkthrough-pm, walkthrough-dev, spec-guide, konspekt). У PR здачі не змінюються —
        будь-яка зміна ❌. Помилку в матеріалах повідомляють окремим issue, а не в PR здачі.

    - path: "materials/**"
      instructions: |
        Брифи команд і JSON ruleset-у репо розробника — матеріали курсу. Будь-яка зміна в PR здачі — ❌.

    - path: "examples/**"
      instructions: |
        Зразки з демо-репозиторію — матеріал курсу. Будь-яка зміна в PR здачі — ❌.

    - path: ".github/**"
      instructions: |
        Шаблон PR курсу. Будь-яка зміна в PR здачі — ❌.

    - path: "README.md"
      instructions: |
        README курсу. Будь-яка зміна в PR здачі — ❌.

    - path: "AGENTS.md"
      instructions: |
        Правила агента для репозиторію курсу. Будь-яка зміна в PR здачі — ❌.

    - path: "CLAUDE.md"
      instructions: |
        Імпорт AGENTS.md для Claude Code. Будь-яка зміна в PR здачі — ❌.

  pre_merge_checks:
    docstrings:
      mode: "off"

    title:
      mode: "warning"
      requirements: >
        PR title should follow: "WS6: <participant full name>" (two words, a real name, not a GitHub login).

    # The built-in description check takes only `mode`; the name requirement is a custom check.
    description:
      mode: "warning"

    custom_checks:
      - mode: "warning"
        name: "Опис PR: ім'я та прізвище"
        instructions: >
          Static review of the PR description only; do NOT review the diff or execute anything.
          The description MUST contain a filled-in "Ім'я та Прізвище" field under the "Учасник"
          heading with the participant's real full name (two words). An empty field, a leftover
          placeholder or template comment, or only a GitHub login is NOT acceptable: say so and ask
          the author to add it. Also check that "Роль" (PM or розробник) and "Команда" are filled and that the
          Definition of Done checklist for the participant's role is filled in rather than left as
          unchecked template boxes. PASS if all hold; FAIL otherwise. Answer in Ukrainian.

      - mode: "warning"
        name: "Лише один файл здачі"
        instructions: >
          Static review of the diff only. PASS only if the PR adds exactly one file and changes
          nothing else, and that file is submissions/<team-slug>/<github-login>.md where team-slug
          is one of property-workflows, therapy-scheduling, school-purchasing, leave-portal, and
          github-login matches the "GitHub-логін" field inside the file (case-insensitive) and, when
          visible, the PR author's login. FAIL if any other file is added, modified or deleted
          (README.md, AGENTS.md, CLAUDE.md, docs/, materials/, examples/, .github/, .coderabbit.yaml,
          .gitignore, .gitattributes, submissions/README.md, submissions/_template.md, .gitkeep files,
          another participant's submission), or if the file is placed elsewhere or named differently.
          Name every offending path. Answer in Ukrainian.

      - mode: "warning"
        name: "Поля файлу здачі заповнено"
        instructions: >
          Static review of the submission file only; do NOT open links or run anything. Check the
          "Дані" section: Роль is pm or dev; Команда equals the folder name; "Ваше репо" is
          https://github.com/<owner>/<repo> (owner should equal GitHub-логін; repo is normally
          <team-slug>-spec for pm and <team-slug> for dev — a different owner or name is a warning to
          mention, not a FAIL); SHA is exactly 40 lowercase hex characters (a short SHA, branch or tag
          name is a FAIL); "Репо вимог PM" is https://github.com/<owner>/<repo> and, for pm, equals
          "Ваше репо"; Прод-URL is an https URL (normally *.vercel.app) for dev and "—" for pm. Role pm
          fills the "PM" section and the "Розробник" section is exactly "—"; role dev does the opposite.
          All links are full https://github.com/ links (pull requests as /pull/N, issues as /issues/N,
          comments as /issues/N#issuecomment-M, commits as /commit/<sha>, commit comments as
          /commit/<sha>#commitcomment-M, files and folders as /blob/... or /tree/...).
          For pm: every link of the "PM" section except "Нотатка PM" points to "Ваше репо"; "Сховище
          вимог" is issues, docs or docs/; "Продукт" is an /issues/N link or a /blob/<SHA>/docs/product.md
          link; "Вимоги першого зрізу" are /issues/N links or /blob/<SHA>/docs/requirements/... links;
          "Самоперевірка за чеклістом" is an /issues/N#issuecomment-M link, a
          /blob/<SHA>/docs/requirements/...#L<N> link (a change-log line) or a
          /commit/<sha>#commitcomment-M link; "Зміни вимог із журналом змін" is an
          /issues/N#issuecomment-M, /commit/<sha> or /blob/... link, or exactly "змін не було";
          "Питання, на які ви відповіли" are /issues/N links; "Нотатка PM" has at least three items,
          each with an AC ID, at least two implementations or readings with links (links may point to
          developers' repositories of other owners, or to issues and comments in "Ваше репо"; an item
          marked «прогноз» may give two readings without links), "Чому" and "Що зробив PM".
          For dev: the field "Рядок «Вимоги:» з docs/conformance.md на SHA" reads exactly
          "Вимоги: <URL> · джерело: issues · знімок <YYYY-MM-DD>" (or "джерело: docs") with URL a
          https://github.com/<owner>/<repo> link equal to "Репо вимог PM" (the placeholder
          "Вимоги: — (заповнює /requirements-sync)", a local path instead of the URL or another source
          word is a FAIL; a snapshot date before 2026-10-19 is a warning to mention, not a FAIL, and no
          warning at all when "PR «Оновлення вимог» після уточнень PM" also has the line
          "/requirements-sync <YYYY-MM-DD>: Вимоги актуальні" dated 2026-10-19 or later);
          "Перший PR «Оновлення вимог»", "PR «Специфікація» з перекладом першого зрізу", "PR-и задач
          «Реалізація»" and "PR «Оновлення вимог» після уточнень PM" are /pull/N links in "Ваше репо",
          with at least two under "PR-и задач «Реалізація»" (or one, if the file explains that the PM
          published the first requirements after the end of 16.10 — README, «Не знімає балів»);
          "PR «Оновлення вимог» після уточнень PM" may add the line "/requirements-sync <YYYY-MM-DD>:
          Вимоги актуальні" next to the link (not a FAIL); "PR
          «Специфікація» зі змінами після уточнень" is a /pull/N link in "Ваше репо" or exactly "змін у
          вимогах PM не було"; the journal docs/spec-reading.md and "Зміна impl-<зріз>" are /blob/ or
          /tree/ links in "Ваше репо"; "Питання в репо PM" has at least three links into "Репо вимог
          PM" (issues or issue comments), at least one of them a plain /issues/N link without
          #issuecomment; "AC, які ви реалізували" lists AC IDs. Бонус E is "—" or a description with a
          link. Placeholders such as <…>, "…" or
          untouched template comments instead of values are a FAIL. List every missing or malformed
          field. Answer in Ukrainian.

      - mode: "warning"
        name: "Анонімізація й секрети у здачі"
        instructions: >
          Static review of the diff only. FAIL if the submission file contains a secret value
          (sb_secret_ or sb_publishable_ followed by a value, sbp_ tokens, JWT-looking eyJ strings,
          passwords, database URLs with a password), an email address outside the example.test
          domain, a person's full name (names belong only in the PR description; GitHub logins are
          fine), or what looks like a real client or company name rather than the four team slugs and
          generic product words. Vendor names such as Supabase, Vercel, GitHub, QuickBooks or Buildium
          are fine. PASS otherwise. Answer in Ukrainian.

chat:
  auto_reply: true
